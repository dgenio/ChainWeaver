name: Temporary agent patch for #398

on:
  push:
    branches:
      - agent/step-record-snapshots-398

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[agent-patch-398]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/step-record-snapshots-398
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply centralized snapshot patch and docs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, got {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "chainweaver/executor.py",
              '''    decision: DecisionRecord | None = None\n\n    @model_validator(mode="after")\n''',
              '''    decision: DecisionRecord | None = None\n\n    @model_validator(mode="before")\n    @classmethod\n    def _snapshot_inputs_and_outputs(cls, data: Any) -> Any:\n        """Capture immutable point-in-time snapshots for trace data.\n\n        The live execution context deliberately reuses validated dictionaries for\n        efficiency. A later tool may mutate a nested container it receives, but\n        that must never rewrite the historical inputs/outputs of an earlier step.\n        Centralizing the copy here covers linear, async, DAG, replay/checkpoint,\n        cache, fallback, and direct StepRecord construction paths uniformly.\n        """\n        if not isinstance(data, dict):\n            return data\n        snapshot = dict(data)\n        if "inputs" in snapshot:\n            snapshot["inputs"] = copy.deepcopy(snapshot["inputs"])\n        if snapshot.get("outputs") is not None:\n            snapshot["outputs"] = copy.deepcopy(snapshot["outputs"])\n        return snapshot\n\n    @model_validator(mode="after")\n''',
          )

          p = Path("docs/data-integrity.md")
          text = p.read_text(encoding="utf-8")
          if text.count("five guarantees") != 2:
              raise SystemExit(f"unexpected guarantee-count wording: {text.count('five guarantees')}")
          text = text.replace("five guarantees", "six guarantees")
          marker = "## Non-guarantees\n"
          if text.count(marker) != 1:
              raise SystemExit(f"unexpected Non-guarantees heading count: {text.count(marker)}")
          guarantee = '''## Guarantee 6 — Historical step records are point-in-time snapshots\n\n> Once a `StepRecord` is created, its `inputs` and `outputs` describe that step at\n> that moment. Later mutation of nested lists/dicts in the live execution context,\n> a cache consumer, or caller-owned data cannot retroactively rewrite an earlier\n> trace record.\n\n**Mechanism:** `StepRecord` takes defensive deep copies of `inputs` and `outputs`\ninside a single Pydantic `mode="before"` validator. Every executor lane constructs\nthe same model, so linear, async, DAG, fallback, checkpoint/replay, and cache paths\ninherit one snapshot boundary rather than relying on scattered `deepcopy()` calls.\nOnly the two persisted step fields are copied; the cumulative execution context is\nnot duplicated on every tool invocation.\n\n**Where it can break:** custom opaque Python objects may define unusual deep-copy\nsemantics. Persisted traces are intended to contain ordinary serializable/Pydantic\ndata; objects that cannot be copied or serialized are outside the trace contract.\n\n---\n\n'''
          text = text.replace(marker, guarantee + marker, 1)
          row = '| G5 — Schema-validated context | **No.** Context is free-form prompt history. | **Yes** at every boundary. |\n'
          if text.count(row) != 1:
              raise SystemExit(f"unexpected G5 row count: {text.count(row)}")
          text = text.replace(
              row,
              row + '| G6 — Immutable historical trace snapshots | **No inherent guarantee.** A mutable in-process record can drift unless copied/frozen explicitly. | **Yes.** `StepRecord` snapshots nested inputs/outputs when the record is created. |\n',
              1,
          )
          p.write_text(text, encoding="utf-8")

          replace_once(
              "CHANGELOG.md",
              '''### Fixed\n\n''',
              '''### Fixed\n\n- **Execution traces now snapshot nested step inputs and outputs at record time** (#398):\n  `StepRecord` defensively deep-copies its persisted `inputs`/`outputs` at the\n  model boundary. A later tool mutating a shared nested list/dict in the live\n  context can no longer retroactively rewrite an earlier trace. This is a\n  correctness change for code that incorrectly relied on object identity between\n  caller/context containers and recorded trace data; well-behaved flow semantics\n  are unchanged. The copy is paid once per recorded step, not for the whole\n  cumulative context before every invocation.\n\n''',
          )
          PY
          git diff --check
      - name: Install and run focused regression
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_step_record_snapshots.py
      - name: Run representative benchmark
        run: python benchmarks/bench_naive_vs_compiled.py --steps 5 --llm-ms 10 --repeats 5
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chainweaver/executor.py docs/data-integrity.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "[agent-patch-398] Snapshot StepRecord inputs and outputs"
            git push origin HEAD:agent/step-record-snapshots-398
          fi
