name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tagged version to publish (X.Y.Z)."
        required: true
        type: string

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate tag, commit, and source metadata
        id: release
        shell: bash
        # Inputs flow through env (not direct ${{ }} interpolation in the
        # script body) so a dispatch input cannot inject shell (#495).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          tag="v${version}"
          python scripts/release.py check --expected-version "${version}"

          # Publication must describe exactly the commit the release tag names.
          # ``^{commit}`` works for both lightweight and annotated tags.
          tag_commit="$(git rev-parse "${tag}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          test "${tag_commit}" = "${head_commit}"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${head_commit}" >> "${GITHUB_OUTPUT}"

  test:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[integrations]" --group dev

      - name: Run tests
        run: python -m pytest tests/ -v

  build:
    needs: [release, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Verify exact built distribution metadata
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: python scripts/verify_dist.py "${RELEASE_VERSION}"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A rerun may follow a failure after PyPI accepted the files but
          # before the GitHub Release or distribution checks completed.
          skip-existing: true
          # PEP 740 digital attestations, signed via the same OIDC identity
          # used for trusted publishing (#346). Default-true on this action;
          # set explicitly so the provenance guarantee is visible in the diff.
          attestations: true

  github-release:
    needs: [release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@7c4723f7a335432393329f8f1c564994ce50185d # v3
        with:
          generate_release_notes: true
          tag_name: v${{ needs.release.outputs.version }}
